name: Validate project

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:index
      - name: Check generated paper index
        run: git diff --exit-code -- data/papers.json
      - run: npm run data:validate
      - run: npm run lint
      - run: npm test
